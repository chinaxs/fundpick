name: fundpick-dev
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run pnpm setup:dev first}
      MYSQL_DATABASE: ${MYSQL_DB:-fundpick}
      MYSQL_USER: ${MYSQL_USER:-fundpick_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run pnpm setup:dev first}
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
