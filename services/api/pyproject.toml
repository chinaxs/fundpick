[project]
name = "study-api"
version = "0.1.0"
description = "FundPick：基金模拟交易、持仓管理与基金筛选 API"
license = "MIT"
keywords = ["fund", "paper-trading", "portfolio-tracker", "personal-finance", "fastapi"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.20.34",
    "alembic>=1.20.0",
    "asyncmy>=0.2.17",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "deepagents>=0.7",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.10.0",
    "pypinyin>=0.55.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.17.0",
]

[project.urls]
Homepage = "https://github.com/chinaxs/fundpick"
Repository = "https://github.com/chinaxs/fundpick.git"
Issues = "https://github.com/chinaxs/fundpick/issues"

[tool.uv]
# 应用型项目，不打包安装自身
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",     # FastAPI Depends() 默认参数
    "RUF001",   # 中文全角标点（字符串）
    "RUF002",   # 中文全角标点（docstring）
    "RUF003",   # 中文全角标点（注释）
    "UP046",    # 泛型类暂用 TypeVar 写法，兼容 pydantic 泛型
    "RUF012",   # SQLAlchemy 的 __table_args__ 是声明式语法，非可变类属性
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

# SQLAlchemy 2.x 的泛型存根与 mypy 仍有摩擦：select(Model) 的返回类型被推断为
# tuple[Model] 而非 Model。这里对仓储层定向豁免，其余模块保持完整检查。
[[tool.mypy.overrides]]
module = ["app.repositories.*"]
disable_error_code = ["return-value", "arg-type", "assignment"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "acceptance_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
